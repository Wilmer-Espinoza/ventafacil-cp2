<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VentaFácil</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Pantalla de inicio de sesión -->
  <section id="vista-login" class="login">
    <form id="form-login" class="tarjeta">
      <h1>VentaFácil</h1>
      <p class="sub">Sistema de ventas</p>
      <label>Usuario <input name="usuario" value="admin" required /></label>
      <label>Clave <input name="clave" type="password" value="admin123" required /></label>
      <button type="submit">Ingresar</button>
      <p id="error-login" class="error"></p>
      <p class="ayuda">Demo: admin / admin123</p>
    </form>
  </section>

  <!-- Aplicación -->
  <section id="vista-app" hidden>
    <header>
      <div>
        <strong>VentaFácil</strong>
        <span id="etiqueta-variante" class="chip"></span>
        <span id="etiqueta-version" class="version"></span>
      </div>
      <nav id="menu"></nav>
      <div><span id="nombre-usuario"></span> <button id="btn-salir" class="secundario">Salir</button></div>
    </header>

    <main>
      <div id="tab-productos" class="tab">
        <h2>Productos</h2>
        <form id="form-producto" class="fila">
          <input name="nombre" placeholder="Nombre" required />
          <input name="precio" type="number" step="0.01" min="0.01" placeholder="Precio" required />
          <input name="stock" type="number" min="0" placeholder="Stock" required />
          <button>Agregar</button>
        </form>
        <table><thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr></thead><tbody id="tabla-productos"></tbody></table>
      </div>

      <div id="tab-clientes" class="tab" hidden>
        <h2>Clientes</h2>
        <form id="form-cliente" class="fila">
          <input name="nombre" placeholder="Nombre" required />
          <input name="cedula" placeholder="Cédula (10 dígitos)" pattern="\d{10}" required />
          <input name="telefono" placeholder="Teléfono" />
          <button>Agregar</button>
        </form>
        <table><thead><tr><th>ID</th><th>Nombre</th><th>Cédula</th><th>Teléfono</th></tr></thead><tbody id="tabla-clientes"></tbody></table>
      </div>

      <div id="tab-ventas" class="tab" hidden>
        <h2>Nueva venta</h2>
        <form id="form-venta">
          <div class="fila">
            <select name="clienteId" id="sel-cliente"></select>
            <select id="sel-producto"></select>
            <input id="cant-producto" type="number" min="1" value="1" />
            <button type="button" id="btn-agregar-item" class="secundario">+ Añadir</button>
          </div>
          <ul id="lista-items"></ul>
          <div class="fila" id="fila-descuento" hidden>
            <input name="codigoDescuento" placeholder="Código de descuento (opcional)" />
          </div>
          <button>Registrar venta</button>
          <p id="msg-venta"></p>
        </form>
        <h2>Historial</h2>
        <table><thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Subtotal</th><th>Desc.</th><th>IVA</th><th>Total</th></tr></thead><tbody id="tabla-ventas"></tbody></table>
      </div>

      <div id="tab-reportes" class="tab" hidden>
        <h2>Reportes</h2>
        <div id="resumen" class="tarjetas"></div>
        <h3>Más vendidos</h3>
        <ol id="mas-vendidos"></ol>
        <p id="zona-exportar" hidden><a id="btn-exportar" class="boton" href="#">Exportar ventas a CSV</a></p>
      </div>

      <div id="tab-descuentos" class="tab" hidden>
        <h2>Descuentos</h2>
        <form id="form-descuento" class="fila">
          <input name="codigo" placeholder="Código" required />
          <input name="porcentaje" type="number" min="1" max="100" placeholder="%" required />
          <button>Crear</button>
        </form>
        <table><thead><tr><th>Código</th><th>%</th><th>Activo</th></tr></thead><tbody id="tabla-descuentos"></tbody></table>
      </div>
    </main>
  </section>

  <script src="/app.js"></script>
</body>
</html>
